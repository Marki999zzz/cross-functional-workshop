<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Warsztat Współpracy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#efece5; --border:#e2ddd2;
  --text:#211f1a; --text-muted:#6c6a62; --text-soft:#8b887e;
  --accent:#33449e; --accent-strong:#232f70; --accent-soft:#e6e9f8;
  --dept-sales:#a5590a; --dept-sales-soft:#faead4;
  --dept-rnd:#0e7a8a; --dept-rnd-soft:#dbf1f3;
  --dept-pm:#6a3ba0; --dept-pm-soft:#efe3fa;
  --pri-high:#b7362a; --pri-high-soft:#fae1de;
  --pri-med:#a3730f; --pri-med-soft:#f8ecd0;
  --pri-low:#2c7a4c; --pri-low-soft:#dff2e5;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(30,26,16,.05), 0 10px 28px -14px rgba(30,26,16,.22);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161a; --surface:#1d1f24; --surface-2:#24262c; --border:#31333a;
    --text:#eceef1; --text-muted:#a2a6ae; --text-soft:#787c85;
    --accent:#7c8ef0; --accent-strong:#a4b1f7; --accent-soft:#262c48;
    --dept-sales:#e0a24f; --dept-sales-soft:#3a2c17;
    --dept-rnd:#4fc3d4; --dept-rnd-soft:#123138;
    --dept-pm:#b48af0; --dept-pm-soft:#2c2140;
    --pri-high:#f0857a; --pri-high-soft:#3a1e1c;
    --pri-med:#e3b45c; --pri-med-soft:#382c15;
    --pri-low:#7cd9a0; --pri-low-soft:#153826;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg); color:var(--text); font-family:'Inter',system-ui,-apple-system,sans-serif; padding-inline:16px; padding-block:16px;}
h1,h2,h3,.disp{font-family:'Sora',system-ui,sans-serif;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
a{color:var(--accent);}
button{font-family:inherit; cursor:pointer;}
textarea,select,input{font-family:inherit; font-size:15px;}
.btn{border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:var(--radius-sm); padding:10px 16px; font-size:14px; font-weight:600; transition:transform .08s ease, border-color .15s ease;}
.btn:hover{border-color:var(--accent);}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
.btn-ghost{background:transparent; border-color:transparent; color:var(--text-muted);}
.btn-ghost:hover{color:var(--text); border-color:var(--border);}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}
.btn-sm{padding:6px 10px; font-size:12.5px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.wrap{max-width:1180px; margin-inline:auto;}
.row{display:flex; gap:10px; flex-wrap:wrap;}
.col{display:flex; flex-direction:column; gap:10px;}
.muted{color:var(--text-muted);}
.soft{color:var(--text-soft);}
label.field-label{font-weight:600; font-size:14.5px; display:block; margin-bottom:6px;}
textarea.field{width:100%; min-height:78px; resize:vertical; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text);}
textarea.field:focus, select.field:focus, input.field:focus{outline:2px solid var(--accent); outline-offset:1px;}
select.field, input.field{width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text);}
.hr{height:1px; background:var(--border); border:none; margin:14px 0;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
[hidden]{display:none!important;}
.dept-chip{padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700;}
.dept-sales{background:var(--dept-sales-soft); color:var(--dept-sales);}
.dept-rnd{background:var(--dept-rnd-soft); color:var(--dept-rnd);}
.dept-pm{background:var(--dept-pm-soft); color:var(--dept-pm);}
.pri-high{background:var(--pri-high-soft); color:var(--pri-high);}
.pri-medium{background:var(--pri-med-soft); color:var(--pri-med);}
.pri-low{background:var(--pri-low-soft); color:var(--pri-low);}
.theme-card{border-left:4px solid; border-radius:var(--radius-sm); padding:12px 14px; background:var(--surface-2);}
.resp-item{padding:8px 10px; border-radius:var(--radius-sm); background:var(--surface-2); font-size:13.5px; line-height:1.4;}
.scroll-list{max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding-right:4px;}
.timer-box{font-family:'JetBrains Mono',monospace; font-size:34px; font-weight:700; letter-spacing:.02em; font-variant-numeric:tabular-nums;}
.module-chip{border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:7px 14px; font-size:13px; font-weight:600; white-space:nowrap; color:var(--text-muted);}
.module-chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.grid-host{display:grid; grid-template-columns:340px 1fr; gap:16px;}
@media (max-width:860px){ .grid-host{grid-template-columns:1fr;} }
.step-item{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px dashed var(--border);}
.step-item:last-child{border-bottom:none;}
.step-num{flex:none; width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.bar-track{background:var(--surface-2); border-radius:6px; height:22px; overflow:hidden; flex:1;}
.bar-fill{height:100%; background:var(--accent); border-radius:6px 0 0 6px; display:flex; align-items:center; justify-content:flex-end; padding-right:8px;}
.toast{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--accent-strong); color:#fff; padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); z-index:50; opacity:0; transition:opacity .25s ease; pointer-events:none;}
.toast.show{opacity:1;}
.top-note{background:var(--accent-soft); color:var(--accent-strong); border-radius:var(--radius-sm); padding:10px 12px; font-size:13px;}
.lang-switch{display:flex; border:1px solid var(--border); border-radius:999px; overflow:hidden;}
.lang-switch button{border:none; background:transparent; padding:5px 12px; font-size:12.5px; font-weight:700; color:var(--text-muted);}
.lang-switch button.active{background:var(--accent); color:#fff;}
.join-card{max-width:440px; margin:8vh auto 0; padding:28px 26px;}
.dept-pick{display:flex; flex-direction:column; gap:8px;}
.dept-opt{border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:11px 14px; display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:14.5px;}
.dept-opt.selected{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong);}
.ai-bridge{border:1.5px dashed var(--border); border-radius:var(--radius-sm); padding:12px; margin-top:8px; background:var(--surface-2);}
.ai-bridge textarea{width:100%; min-height:90px; font-family:'JetBrains Mono',monospace; font-size:11.5px; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text);}
.step-badge{display:inline-flex; width:18px; height:18px; border-radius:50%; background:var(--accent); color:#fff; font-size:11px; font-weight:800; align-items:center; justify-content:center; margin-right:6px;}
body.screen-mode{font-size:18px;}
body.screen-mode .wrap{max-width:1400px;}
body.screen-mode .resp-item{font-size:17px; padding:12px 16px;}
body.screen-mode .theme-card{padding:16px 20px;}
body.screen-mode .theme-card strong{font-size:17px;}
body.screen-mode .pill{font-size:13.5px; padding:5px 13px;}
body.screen-mode .scroll-list{max-height:340px;}
body.screen-mode .bar-track{height:30px;}
</style>
</head>

function toast(msg){

/* ===================== sb helpers ===================== */
function subscribeFiltered(table, col, val, cb){
  async function refetch(){
    let q = sb.from(table).select('*');
    if(col) q = q.eq(col, val);
    const { data, error } = await q;
    if(!error) cb(data||[]);
  }
  refetch();
  const channel = sb.channel(table+'_'+(val||'all')+'_'+Math.random().toString(36).slice(2))
    .on('postgres_changes', { event:'*', schema:'public', table }, ()=> refetch())
    .subscribe();
  return ()=> sb.removeChannel(channel);
}
function subscribeSessionState(cb){
  async function refetch(){
    const { data, error } = await sb.from('session_state').select('*').eq('id',1).single();
    if(!error && data) cb(data);
  }
  refetch();
  const channel = sb.channel('session_state_ch_'+Math.random().toString(36).slice(2))
    .on('postgres_changes', { event:'*', schema:'public', table:'session_state' }, ()=> refetch())
    .subscribe();
  return ()=> sb.removeChannel(channel);
}
function subscribeAnalysis(key, cb){
  async function refetch(){
    const { data } = await sb.from('analysis').select('*').eq('key',key).maybeSingle();
    cb(data||null);
  }
  refetch();
  const channel = sb.channel('analysis_'+key.replace(/[^a-z0-9]/gi,'_')+'_'+Math.random().toString(36).slice(2))
    .on('postgres_changes', { event:'*', schema:'public', table:'analysis', filter:`key=eq.${key}` }, ()=> refetch())
    .subscribe();
  return ()=> sb.removeChannel(channel);
}

/* ===================== Boot ===================== */
function boot(){
  if(MODE==='screen') document.body.classList.add('screen-mode');
  if(!sb){ render(); return; }

  const presenceChannel = sb.channel('presence-room', { config:{ presence:{ key: clientId } } });
  presenceChannel.on('presence', {event:'sync'}, ()=>{
    const state = presenceChannel.presenceState();
    peerCount = Math.max(1, Object.keys(state).length);
    renderHostHeaderCount();
  });
  presenceChannel.subscribe(async (status)=>{
    if(status==='SUBSCRIBED'){ try{ await presenceChannel.track({ role: MODE, at: Date.now() }); }catch(e){} }
  });

  subscribeSessionState(data=>{ currentSession = data; render(); });
  render();
}

function buildAnswerForm(mod){
  const box = document.createElement('div');
  const num = mod.num!=null? mod.num+'. ':'';
  let promptsHtml = '';
  if(mod.needsDept && dept && mod.prompts && mod.prompts[dept]){
    promptsHtml = `<div class="top-note" style="margin-bottom:14px;">
      <strong>${t('suggested_prompts',lang)}:</strong>
      <ul style="margin:6px 0 0 18px;padding:0;">${mod.prompts[dept][lang].map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul>
    </div>`;
  }
  box.innerHTML = `
    <div style="margin-bottom:4px;" class="soft">${num}${escapeHtml((mod.title[lang]||'').replace(/^\d+\.\s*/,''))}</div>
    <div class="disp" style="font-size:19px;font-weight:800;margin-bottom:4px;">${escapeHtml(mod.subtitle[lang]||mod.title[lang])}</div>
    ${promptsHtml}
    <div id="fieldsHost" class="col"></div>
    <button class="btn btn-primary" id="submitBtn" style="margin-top:14px;">${t('submit',lang)}</button>
  `;
  const fh = box.querySelector('#fieldsHost');
  mod.fields.forEach(f=>{
    const d = document.createElement('div');
    d.innerHTML = `<label class="field-label">${escapeHtml(f.label[lang])}</label><textarea class="field" data-fid="${f.id}"></textarea>`;
    fh.appendChild(d);
  });
  box.querySelector('#submitBtn').onclick = async ()=>{
    const values = {};
    let any=false;
    fh.querySelectorAll('textarea').forEach(ta=>{ const v=ta.value.trim(); if(v){ values[ta.dataset.fid]=v; any=true; } });
    if(!any) return;
    const btn = box.querySelector('#submitBtn'); btn.disabled=true;
    try{
      const { error } = await sb.from('responses').insert({ module_id: mod.id, dept: dept||null, name: pname||null, values });
      if(error) throw error;
      fh.querySelectorAll('textarea').forEach(ta=> ta.value='');
      toast(t('thanks',lang));
    }catch(e){ toast('Error: '+(e&&e.message||e)); }
    btn.disabled=false;
  };
  return box;
}

function buildVoteForm(mod){
  const box = document.createElement('div');

    row.style.cssText='display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:9px;';
    row.innerHTML = `<input type="checkbox" value="${escapeHtml(o.id)}" style="width:18px;height:18px;" /> <span>${escapeHtml(o.label||'')}</span>`;
    vo.appendChild(row);
  });

  };
  return box;
}

function buildTimerHtml(mod){
  return `<hr class="hr" />
  <div class="row" style="align-items:center;justify-content:space-between;">
    <div id="timerDisplay" class="timer-box"></div>
    <div class="row">
      <button class="btn btn-sm" id="timerStartBtn"></button>
      <button class="btn btn-sm btn-ghost" id="timerResetBtn">${t('reset_timer',lang)}</button>
    </div>
  </div>`;
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function computeRemaining(mod){
  if(mod.duration==null) return null;
  if(currentSession.timer_module_id!==mod.id) return mod.duration*60;
  let rem = currentSession.timer_remaining_seconds!=null ? currentSession.timer_remaining_seconds : mod.duration*60;
  if(currentSession.timer_running && currentSession.timer_started_at){
    const elapsed = Math.floor((Date.now() - new Date(currentSession.timer_started_at).getTime())/1000);
    rem = rem - elapsed;
  }
  return Math.max(0, rem);
}
function isTimerRunning(mod){ return !!(currentSession.timer_running && currentSession.timer_module_id===mod.id); }
async function timerStart(mod){
  const rem = computeRemaining(mod);
  try{ await sb.from('session_state').update({ timer_module_id:mod.id, timer_remaining_seconds:rem, timer_running:true, timer_started_at:new Date().toISOString(), updated_at:new Date().toISOString() }).eq('id',1); }
  catch(e){ toast('Error: '+(e&&e.message||e)); }
}
async function timerPause(mod){
  const rem = computeRemaining(mod);
  try{ await sb.from('session_state').update({ timer_remaining_seconds:rem, timer_running:false, timer_started_at:null, updated_at:new Date().toISOString() }).eq('id',1); }
  catch(e){ toast('Error: '+(e&&e.message||e)); }
}
async function timerReset(mod){
  try{ await sb.from('session_state').update({ timer_module_id:mod.id, timer_remaining_seconds:mod.duration*60, timer_running:false, timer_started_at:null, updated_at:new Date().toISOString() }).eq('id',1); }
  catch(e){ toast('Error: '+(e&&e.message||e)); }
}
function paintTimer(disp, mod){
  const rem = computeRemaining(mod);
  disp.textContent = rem<=0 ? t('time_up',lang) : fmtTime(rem);
  disp.style.color = rem<=60 ? 'var(--pri-high)' : 'var(--text)';
}
function wireTimer(panel, mod){
  const disp = panel.querySelector('#timerDisplay');
  const startBtn = panel.querySelector('#timerStartBtn');
  const resetBtn = panel.querySelector('#timerResetBtn');
  function paint(){ paintTimer(disp, mod); startBtn.textContent = isTimerRunning(mod)? t('pause_timer',lang) : t('start_timer',lang); }
  paint();
  clearInterval(activeTimerInterval);
  activeTimerInterval = setInterval(paint, 1000);
  startBtn.onclick = ()=>{ isTimerRunning(mod) ? timerPause(mod) : timerStart(mod); };
  resetBtn.onclick = ()=> timerReset(mod);
}
function attachReadonlyTimer(hostEl, mod){
  const disp = hostEl.querySelector('#timerDisplay');
  function paint(){ paintTimer(disp, mod); }
  paint();
  clearInterval(activeTimerInterval);
  activeTimerInterval = setInterval(paint, 1000);
}

function renderFieldsResults(body, mod, docs, readOnly){
  body.innerHTML='';
  mod.fields.forEach(f=>{
    const items = docs.filter(d=> d.values && d.values[f.id]).map(d=>({ text:d.values[f.id], dept:d.dept }));
    const block = document.createElement('div');
    block.style.marginBottom='18px';
    block.innerHTML = `
      <div class="row" style="justify-content:space-between;align-items:center;">
        <div style="font-weight:700;font-size:13.5px;">${escapeHtml(f.label[lang])}</div>
        <span class="pill" style="background:var(--surface-2);color:var(--text-muted);">${items.length} ${t('responses_n',lang)}</span>
      </div>
      <div class="scroll-list" style="margin-top:8px;" data-raw></div>
      ${readOnly? '' : `<div class="row" style="margin-top:8px;">
        <button class="btn btn-sm" data-analyze="${f.id}" ${!items.length?'disabled':''}>${t('analyze_btn',lang)}</button>
      </div>`}
      <div data-analysis style="margin-top:10px;"></div>
      ${readOnly? '' : '<div data-bridge></div>'}
    `;
    const rawList = block.querySelector('[data-raw]');
    if(!items.length){ rawList.innerHTML = `<div class="muted" style="font-size:12.5px;">${t('no_responses',lang)}</div>`; }
    else items.slice().reverse().forEach(it=>{
      const el = document.createElement('div'); el.className='resp-item';
      el.innerHTML = (it.dept? `<span class="dept-chip dept-${it.dept}" style="margin-right:6px;">${t('dept_'+it.dept,lang)}</span>`:'') + escapeHtml(it.text);
      rawList.appendChild(el);
    });
    body.appendChild(block);

    const analysisHost = block.querySelector('[data-analysis]');
    subscribeAnalysis(mod.id+'__'+f.id, data=>{ if(data) renderAnalysis(analysisHost, data); });

/* ---- Manual AI bridge (copy prompt to Claude chat, paste JSON back) ---- */
function buildAiBridgeBox(promptText, onSave){
  const box = document.createElement('div');
  box.className='ai-bridge';
  box.innerHTML = `
    <div style="font-size:12.5px;margin-bottom:6px;"><span class="step-badge">1</span>${t('bridge_step1',lang)}</div>
    <textarea readonly>${escapeHtml(promptText)}</textarea>
    <div class="row" style="margin-top:6px;">
      <button class="btn btn-sm" data-copy>${t('bridge_copy',lang)}</button>
      <button class="btn btn-sm btn-ghost" data-close>${t('hide_bridge',lang)}</button>
    </div>
    <div style="font-size:12.5px;margin:12px 0 6px;"><span class="step-badge">2</span>${t('bridge_step2',lang)}</div>
    <textarea data-result placeholder='{"themes":[...]}'></textarea>
    <div id="bridgeErr" class="muted" style="color:var(--pri-high);font-size:12px;margin-top:4px;" hidden>${t('bridge_error',lang)}</div>
    <button class="btn btn-sm btn-primary" data-save style="margin-top:8px;">${t('bridge_save',lang)}</button>
  `;
  box.querySelector('[data-copy]').onclick = async ()=>{
    try{ await navigator.clipboard.writeText(promptText); toast(t('bridge_copied',lang)); }
    catch(e){ box.querySelector('textarea').select(); document.execCommand('copy'); toast(t('bridge_copied',lang)); }
  };
  box.querySelector('[data-close]').onclick = ()=> box.remove();
  box.querySelector('[data-save]').onclick = ()=>{
    const raw = box.querySelector('[data-result]').value.trim();
    const err = box.querySelector('#bridgeErr');
    let parsed;
    try{
      const start = raw.indexOf('{')>=0 ? Math.min(...[raw.indexOf('{'), raw.indexOf('[')].filter(i=>i>=0)) : -1;
      const jsonSlice = start>=0 ? raw.slice(start) : raw;
      parsed = JSON.parse(jsonSlice);
    }catch(e){ err.hidden=false; return; }
    err.hidden=true;
    onSave(parsed);
    box.remove();
  };
  return box;
}

function openAnalyzeBridge(host, mod, field, items){
  host.innerHTML='';
  const list = items.map((it,i)=> (i+1)+'. '+it.text.replace(/\n/g,' ')).join('\n');
  const prompt = lang==='pl'
    ? `Oto surowe odpowiedzi uczestników warsztatu na pytanie: "${field.label.pl}"\n\n${list}\n\nPogrupuj je w 3-6 tematycznych kategorii. Dla każdej podaj: krótką nazwę tematu po polsku, liczbę pasujących odpowiedzi, priorytet ("high"/"medium"/"low" na podstawie częstości i wagi problemu) oraz maks. 2 krótkie przykładowe cytaty. Odpowiedz WYŁĄCZNIE w formacie JSON: {"themes":[{"theme":string,"count":number,"priority":"high"|"medium"|"low","examples":[string]}]}, posortowane malejąco po priorytecie.`
    : `Here are raw workshop participant answers to the question: "${field.label.en}"\n\n${list}\n\nGroup them into 3-6 thematic categories. For each give: a short theme name, the number of matching answers, a priority ("high"/"medium"/"low" based on frequency and severity), and up to 2 short example quotes. Reply ONLY with JSON: {"themes":[{"theme":string,"count":number,"priority":"high"|"medium"|"low","examples":[string]}]}, sorted by priority descending.`;
  const box = buildAiBridgeBox(prompt, async (parsed)=>{
    const themes = (parsed && parsed.themes) || (Array.isArray(parsed)? parsed: []);
    try{
      const { error } = await sb.from('analysis').upsert({ key: mod.id+'__'+field.id, themes, updated_at: new Date().toISOString() });
      if(error) throw error;
    }catch(e){ toast('Error: '+(e&&e.message||e)); }
  });
  host.appendChild(box);
}

function buildVoteAdminBlock(mod, docs, readOnly){
  const box = document.createElement('div'); box.className='card'; box.style.cssText='padding:14px;margin-top:6px;background:var(--surface-2);border-style:dashed;';
  const hasOptions = currentSession.vote_module_id===mod.id && (currentSession.vote_options||[]).length;

  if(!readOnly){
    const genHost = box.querySelector('[data-genhost]');
    const genBtn = document.createElement('button');
    genBtn.className='btn btn-sm'; genBtn.textContent = t('generate_vote_list',lang);
    genBtn.onclick = ()=>{
      const items = docs.filter(d=>d.values && d.values.one_change).map(d=>d.values.one_change);
      if(!items.length){ toast(t('no_responses_ai',lang)); return; }
      const list = items.map((x,i)=>(i+1)+'. '+x.replace(/\n/g,' ')).join('\n');
      const prompt = lang==='pl'
        ? `Oto propozycje zmian od uczestników warsztatu:\n\n${list}\n\nWyodrębnij unikalne, konkretne pomysły (połącz duplikaty i bardzo podobne). Zwróć 5-10 pozycji. Odpowiedz WYŁĄCZNIE w formacie JSON: {"options":[string,...]} — każdy string to krótki, zrozumiały opis pomysłu po polsku.`
        : `Here are improvement proposals from workshop participants:\n\n${list}\n\nExtract unique, concrete ideas (merge duplicates and near-duplicates). Return 5-10 items. Reply ONLY with JSON: {"options":[string,...]} — each string a short, clear idea description in English.`;
      genHost.innerHTML='';
      const bridgeBox = buildAiBridgeBox(prompt, async (parsed)=>{
        const opts = (parsed && parsed.options) || [];
        const voteOptions = opts.map((label,i)=>({ id:'opt'+i, label }));
        try{
          await sb.from('session_state').update({ vote_module_id: mod.id, vote_options: voteOptions, updated_at:new Date().toISOString() }).eq('id',1);
          await sb.from('votes').delete().not('client_id','is',null);
        }catch(e){ toast('Error: '+(e&&e.message||e)); }
      });
      genHost.innerHTML=''; genHost.appendChild(bridgeBox);
    };
    genHost.appendChild(genBtn);
  }

  const tally = document.createElement('div'); tally.style.marginTop='12px'; tally.className='col';
  box.appendChild(tally);
  if(hasOptions){
    subscribeFiltered('votes','module_id',mod.id, voteDocs=>{
      const counts = {}; currentSession.vote_options.forEach(o=> counts[o.id]=0);
      voteDocs.forEach(d=>{ (d.picks||[]).forEach(p=>{ if(counts[p]!=null) counts[p]++; }); });
      const max = Math.max(1, ...Object.values(counts));
      const sorted = currentSession.vote_options.slice().sort((a,b)=> (counts[b.id]||0)-(counts[a.id]||0));
      tally.innerHTML='';
      sorted.forEach((o,i)=>{
        const c = counts[o.id]||0;
        const row = document.createElement('div');
        row.className='row'; row.style.alignItems='center';
        row.innerHTML = `<div style="width:26px;font-weight:800;" class="${i<3?'':'muted'}">${i+1}</div>
          <div style="flex:1;font-size:13px;">${escapeHtml(o.label||'')}</div>
          <div class="bar-track" style="max-width:160px;"><div class="bar-fill" style="width:${(c/max*100)}%;"><span class="mono" style="color:#fff;font-size:11px;">${c}</span></div></div>`;
        tally.appendChild(row);
      });
    });
  } else {
    tally.innerHTML = `<div class="muted" style="font-size:12.5px;">${t('no_vote_yet',lang)}</div>`;
  }
  return box;
}

/* ===================== Summary block (shared by host+participant) ===================== */
function buildSummaryBlock(){
  const el = document.createElement('div');
  el.innerHTML = `<div class="disp" style="font-size:19px;font-weight:800;margin-bottom:12px;">${t('summary_title',lang)}</div><div id="sumBody" class="col"></div>`;
  const body = el.querySelector('#sumBody');

  const sec = (titleKey)=>{ const d=document.createElement('div'); d.innerHTML=`<div style="font-weight:700;font-size:14px;margin-bottom:6px;">${t(titleKey,lang)}</div><div data-c class="col"></div>`; body.appendChild(d); return d.querySelector('[data-c]'); };

  const checklistC = sec('summary_checklist');
  const ideasC = sec('summary_ideas');
  const charterC = sec('summary_charter');
  const commitC = sec('summary_commit');

  if(sb){
    subscribeFiltered('responses','module_id','journey_sim', docs=>{
      const items = docs.filter(d=>d.values&&d.values.checklist_item).map(d=>d.values.checklist_item);
      checklistC.innerHTML = items.length? items.map(x=>`<div class="resp-item">☑ ${escapeHtml(x)}</div>`).join('') : `<div class="muted" style="font-size:12.5px;">${t('summary_empty',lang)}</div>`;
    });

    subscribeFiltered('votes','module_id','ceo_discussion', voteDocs=>{
      const opts = currentSession.vote_options||[];
      if(!opts.length){ ideasC.innerHTML = `<div class="muted" style="font-size:12.5px;">${t('summary_empty',lang)}</div>`; return; }
      const counts={}; opts.forEach(o=>counts[o.id]=0);
      voteDocs.forEach(d=> (d.picks||[]).forEach(p=>{ if(counts[p]!=null) counts[p]++; }));
      const top3 = opts.slice().sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0)).slice(0,3);
      ideasC.innerHTML = top3.map((o,i)=>`<div class="resp-item"><strong>#${i+1}</strong> ${escapeHtml(o.label||'')} <span class="soft">(${counts[o.id]||0})</span></div>`).join('');
    });

    charterC.innerHTML = (currentSession.charter||[]).length ? currentSession.charter.map(c=>`<div class="resp-item">📌 ${escapeHtml(c)}</div>`).join('') : `<div class="muted" style="font-size:12.5px;">${t('summary_empty',lang)}</div>`;

    subscribeFiltered('responses','module_id','closing', docs=>{
      commitC.innerHTML = docs.length ? docs.map(d=>`<div class="resp-item">${d.values.start_tomorrow? '➡ '+escapeHtml(d.values.start_tomorrow)+'<br/>':''}${d.values.need_from_others? '🤝 '+escapeHtml(d.values.need_from_others):''}</div>`).join('') : `<div class="muted" style="font-size:12.5px;">${t('summary_empty',lang)}</div>`;
    });
  }
  return el;
}

/* ===================== Reset ===================== */
async function doReset(){
  if(!confirm(t('reset_confirm',lang))) return;
  try{
    await sb.from('responses').delete().not('id','is',null);
    await sb.from('votes').delete().not('client_id','is',null);
    await sb.from('analysis').delete().not('key','is',null);
    await sb.from('session_state').update({ active_module:'welcome', vote_module_id:null, vote_options:[], charter:[], timer_module_id:null, timer_remaining_seconds:null, timer_running:false, timer_started_at:null, updated_at:new Date().toISOString() }).eq('id',1);
    toast('OK');
  }catch(e){ toast('Error: '+(e&&e.message||e)); }
}

boot();
</script>
